<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nekz setup</title>
<style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#e8eee9;background:#09110d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0,#163c2c,transparent 48%),#09110d}.wrap{max-width:490px;margin:0 auto;padding:42px 25px}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:#23c976;color:#062412;font-weight:900;font-size:22px}h1{margin:18px 0 6px;font-size:26px}.sub,.hint{color:#91a59a;font-size:13px;line-height:1.55}.card{margin-top:25px;padding:23px;border:1px solid #21372a;border-radius:18px;background:#101b15}label{display:block;margin:17px 0 7px;font-size:13px;font-weight:650;color:#cddbd1}input,select{width:100%;padding:12px;border:1px solid #2a4334;border-radius:10px;background:#0b140f;color:#e8eee9;font:inherit}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:11px;background:#22c875;color:#062412;font:inherit;font-weight:750;cursor:pointer}#error{color:#ff958b;font-size:13px;min-height:18px}.safe{font-size:12px;color:#82968a;margin-top:18px}
</style></head><body><main class="wrap"><div class="logo">N</div><h1>Set up Nekz</h1><p class="sub">Connect your AI provider. Your key and WhatsApp link credentials stay on this computer.</p>
<form class="card" id="form"><label for="provider">AI provider</label><select id="provider"><option value="gemini">Google Gemini</option><option value="openai">OpenAI</option></select><label for="apiKey" id="keyLabel">Gemini API key</label><input id="apiKey" type="password" autocomplete="off" placeholder="Paste API key" required><p class="hint" id="keyHint">Create a key in Google AI Studio. Leave blank to keep the saved key.</p><label for="model">Model</label><input id="model" autocomplete="off"><label for="owner">Assistant owner name</label><input id="owner" autocomplete="name" value="Nekz"><p id="error" role="alert"></p><button type="submit">Save setup and open Nekz</button><p class="safe">Nekz saves its configuration, conversation history, and linked-device session in this app’s private data folder.</p></form></main>
<script>
const $=id=>document.getElementById(id),provider=$('provider');let hasKey=false;
const defaults={gemini:'gemini-3.5-flash-lite',openai:'gpt-4o-mini'};
function updateProvider(){const p=provider.value;$('keyLabel').textContent=p==='gemini'?'Gemini API key':'OpenAI API key';$('keyHint').textContent=(p==='gemini'?'Create a key in Google AI Studio. ':'Create an API key in your OpenAI account. ')+(hasKey&&p===provider.initialValue?'Leave blank to keep the saved key.':'');$('model').value=defaults[p]}
window.addEventListener('DOMContentLoaded',async()=>{try{const s=await window.nekzDesktop.getSetup();provider.value=s.provider;provider.initialValue=s.provider;$('owner').value=s.ownerName;hasKey=s.hasKey;$('model').value=s.model||defaults[s.provider];updateProvider();$('model').value=s.model||defaults[s.provider];$('apiKey').required=!s.hasKey}catch(e){$('error').textContent=e.message}});
provider.addEventListener('change',()=>{$('apiKey').required=!(hasKey&&provider.value===provider.initialValue);updateProvider()});
$('form').addEventListener('submit',async event=>{event.preventDefault();$('error').textContent='';try{await window.nekzDesktop.saveSetup({provider:provider.value,apiKey:$('apiKey').value,model:$('model').value,ownerName:$('owner').value})}catch(e){$('error').textContent=e.message}});
</script></body></html>
